[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[profile.coverage]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 1000 }

# See https://book.getfoundry.sh/ for details.
