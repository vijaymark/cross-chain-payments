<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cross-chain-payments">
  <defs>
    <linearGradient id="ccpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="ccpGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b5cff"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>

  <!-- dark background -->
  <rect width="512" height="512" rx="112" fill="#0b1020"/>

  <!-- interlocking chain links -->
  <!-- link 1 (back, lower-left to upper-right) -->
  <path d="M150 236
           a64 64 0 0 1 64 -64
           h8
           a64 64 0 0 1 64 64
           v40
           a64 64 0 0 1 -64 64
           h-8
           a64 64 0 0 1 -64 -64
           z"
        fill="none" stroke="url(#ccpGrad)" stroke-width="44" stroke-linejoin="round"/>

  <!-- link 2 (front, upper-left to lower-right) -->
  <path d="M236 150
           a64 64 0 0 1 64 -64
           h8
           a64 64 0 0 1 64 64
           v40
           a64 64 0 0 1 -64 64
           h-8
           a64 64 0 0 1 -64 -64
           z"
        fill="none" stroke="url(#ccpGrad2)" stroke-width="44" stroke-linejoin="round"/>
</svg>
