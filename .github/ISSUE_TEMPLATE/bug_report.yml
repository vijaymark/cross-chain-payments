name: 🐛 Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please be as specific
        as possible so maintainers can reproduce it quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the problem.
      placeholder: e.g. A single approver can double-count their milestone approval
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repo does this affect?
      options:
        - EVM contracts (contracts/)
        - Soroban contracts (soroban/)
        - Soroban Axelar adapter (soroban-axelar/)
        - TypeScript SDK (sdk/)
        - Reference frontend (app/)
        - CI / tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Deploy / call ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Toolchain / chain versions if relevant.
      placeholder: |
        forge 0.3.0
        cargo 1.85.0
        node 20
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any relevant compiler, test, or runtime output.
      render: shell
