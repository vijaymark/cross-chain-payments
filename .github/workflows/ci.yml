name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"

jobs:
  sdk:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Anvil is needed by the SDK's EVM integration tests.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @cross-chain-payments/sdk

      - name: Typecheck
        run: npm run typecheck -w @cross-chain-payments/sdk

      - name: Build
        run: npm run build -w @cross-chain-payments/sdk

      - name: Test
        run: npm test -w @cross-chain-payments/sdk
        env:
          ANVIL_BIN: anvil

  app:
    name: Build reference frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDK (app consumes its dist)
        run: npm run build -w @cross-chain-payments/sdk

      - name: Build app
        run: npm run build -w @cross-chain-payments/app
