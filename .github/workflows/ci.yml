name: SDK CI

on:
  pull_request:
    paths:
      - "sdk/**"
  push:
    branches: [main]
    paths:
      - "sdk/**"

jobs:
  sdk:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      # Anvil is needed by the SDK's EVM integration tests.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          ANVIL_BIN: anvil
