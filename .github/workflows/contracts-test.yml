name: Contracts CI

on:
  pull_request:
    paths:
      - "contracts/**"
      - "soroban/**"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "soroban/**"

jobs:
  forge:
    name: Foundry (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Test
        run: forge test

  cargo:
    name: Cargo (Soroban)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soroban
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Test
        run: cargo test

      - name: Build wasm
        run: cargo build --release --target wasm32v1-none

      - name: Build Axelar bridge wasm
        run: cargo build --release --target wasm32v1-none
        working-directory: soroban-axelar
